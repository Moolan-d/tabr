name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to publish to the Chrome Web Store (e.g. v1.6.0)'
        required: true
        type: string

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_release: ${{ steps.release_meta.outputs.new_release || 'false' }}
      release_version: ${{ steps.release_meta.outputs.release_version }}
      release_git_tag: ${{ steps.release_meta.outputs.release_git_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Capture current release tag
        id: release_base
        run: |
          latest_tag="$(git tag --sort=-version:refname | head -n 1)"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Release
        id: semantic_release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Capture release metadata
        id: release_meta
        run: |
          before_tag="${{ steps.release_base.outputs.latest_tag }}"
          after_tag="$(git tag --sort=-version:refname | head -n 1)"

          if [ -n "$after_tag" ] && [ "$after_tag" != "$before_tag" ]; then
            echo "new_release=true" >> "$GITHUB_OUTPUT"
            echo "release_git_tag=$after_tag" >> "$GITHUB_OUTPUT"
            echo "release_version=${after_tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          fi

  # Build the extension at the new tag and attach the zip to the GitHub Release.
  # This runs automatically; it never touches the Chrome Web Store.
  package:
    needs: release
    if: needs.release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.release_git_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Zip extension
        env:
          EXTENSION_VERSION: ${{ needs.release.outputs.release_version }}
        run: npm run zip

      - name: Upload zip to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.release_git_tag }}
        run: |
          ZIP_PATH=$(ls .output/*.zip | head -n 1)
          gh release upload "$RELEASE_TAG" "$ZIP_PATH" --clobber

  # Publishing to the Chrome Web Store is a manual, deliberate step.
  # Run this workflow from the Actions tab and pass an existing release tag.
  submit-store:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Zip extension
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          export EXTENSION_VERSION="${RELEASE_TAG#v}"
          npm run zip

      - name: Submit to Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          ZIP_PATH=$(ls .output/*.zip | head -n 1)
          npx wxt submit --chrome-zip "$ZIP_PATH"
